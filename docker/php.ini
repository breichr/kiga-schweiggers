; PHP-Einstellungen für das Docker-Image
upload_max_filesize = 16M
post_max_size = 20M
memory_limit = 256M
expose_php = Off
date.timezone = Europe/Vienna

; Anmeldungen überstehen einen neuen Deploy (Sitzungen liegen im Daten-Volume)
session.save_path = /var/www/data/sessions
session.cookie_httponly = 1
session.use_strict_mode = 1
session.gc_maxlifetime = 14400
session.gc_probability = 1
session.gc_divisor = 100
