# Für Coolify: Build Pack "Docker Compose" wählen.
# Die Domain wird in Coolify beim Dienst "web" eingetragen (Port 80).
services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # Coolify erzeugt daraus eine Domain und leitet sie auf Port 80 weiter.
      - SERVICE_FQDN_WEB_80
      - TZ=Europe/Vienna
      # Auf 1 setzen und neu starten, um ein vergessenes Passwort zu löschen.
      - KIGA_RESET_PASSWORD=${KIGA_RESET_PASSWORD:-0}
    volumes:
      - kiga-data:/var/www/data
      - kiga-uploads:/var/www/html/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kiga-data:
  kiga-uploads:
